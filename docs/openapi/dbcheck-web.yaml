openapi: 3.0.3
info:
  title: db-check Web Report API
  version: 0.1.0
  description: |
    Web service for generating db-check reports from uploaded collector ZIP packages.

    Platform routes (`/api/auth`, `/api/releases`, and later `/api/users`,
    `/api/downloads`) authenticate with a session token from sign-in
    (`Authorization: Bearer <token>`) and answer errors with `ApiError`
    (`{"code", "message"}`): 401 `unauthorized`, 403 `forbidden`,
    404 `not_found`, 400 or 409 `invalid`, anything else `failed`. The
    message is Chinese and shown to the user as-is.

    Access levels: most operations need an active user with no forced
    password change due (otherwise 403); current user accepts any account
    status except disabled. A disabled user's session answers 401.

    The publish API (`/api/ci/releases`) takes no session: it authenticates
    the CI machine credential `DBCHECK_PUBLISH_TOKEN` (ADR 0002).

    The `/api/reports` routes still check the shared `DBCHECK_API_TOKEN` and
    answer `ErrorResponse` until they move to sessions.

servers:
  - url: /

paths:
  /api/auth/sign-in:
    post:
      summary: Sign in with username and password
      description: |
        Opens a session that expires 7 days after it was issued. Failed
        sign-ins are logged; there is no lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in. Pending and rejected users sign in too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed body (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown user or wrong password (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Correct password, but the account is disabled (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/sign-out:
    post:
      summary: End the presented session
      description: Ending an unknown or expired session also succeeds.
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session ended.
        "401":
          description: No bearer token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/me:
    get:
      summary: The signed-in user
      description: Answers any account status except disabled.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The user behind the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/releases:
    get:
      summary: The collector releases the user may see, newest first
      description: |
        Engineers get latest and deprecated releases; admins get every
        status. Needs an active user.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Releases, newest publish time first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorRelease"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or a password change is due (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/releases/{version}/{action}:
    post:
      summary: Change a release's status (admins only)
      description: |
        Applies one row of the release status table
        (docs/specs/collector-and-user-management.md):

        | action | from | to |
        |---|---|---|
        | promote | pre-release, deprecated | latest; the previous latest becomes deprecated |
        | deprecate | latest, deprecated, pre-release | deprecated |
        | revoke | pre-release, latest, deprecated | revoked; `reason` required |
        | restore | revoked | deprecated; the revocation reason is dropped |

        Deprecating or revoking the latest release leaves no latest release.
      security:
        - sessionAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: 1.3.0-rc1
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [promote, deprecate, revoke, restore]
      requestBody:
        description: Only for `revoke`; other actions send no body.
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Trimmed; blank is refused.
      responses:
        "204":
          description: Status changed.
        "400":
          description: The table does not allow the action from the current status, or a revoke has no reason (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown version or action (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/ci/releases:
    post:
      summary: Publish a collector release with its four packages (CI only)
      description: |
        The publish script's API (ADR 0002). One multipart request carries
        the metadata and exactly four `.zip` package files. The server checks
        each file's size and SHA256 against the metadata, stores the files
        under `<data dir>/releases/<version>/`, and inserts the release in
        one transaction, so a refused or interrupted publish leaves nothing
        visible.

        A `vX.Y.Z` tag publishes as latest and the previous latest becomes
        deprecated; a `vX.Y.Z-rcN` tag publishes as a pre-release.

        Re-publishing a version with the same tag, commit, and package files
        answers 200 and changes nothing; any other difference answers 409.
        User sessions are never accepted.
      security:
        - publishAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, linux-amd64, linux-arm64, windows-amd64, windows-arm64]
              properties:
                metadata:
                  $ref: "#/components/schemas/PublishMetadata"
                linux-amd64:
                  type: string
                  format: binary
                  description: The package file; its file name must end in `.zip` and it must be a zip.
                linux-arm64:
                  type: string
                  format: binary
                windows-amd64:
                  type: string
                  format: binary
                windows-arm64:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        "200":
          description: Identical re-publish; the stored release, unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRelease"
        "201":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRelease"
        "400":
          description: |
            `invalid`: malformed request or metadata; a version that is not
            `X.Y.Z` or `X.Y.Z-rcN`; a tag other than `v<version>`; an unknown
            database type; a missing, repeated, or unknown platform; a
            package that is not a `.zip`; a size or SHA256 mismatch; a body
            over `--max-upload-bytes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or wrong publish credential (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Publishing is disabled because `DBCHECK_PUBLISH_TOKEN` is not set (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The version is already published with different content (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/generate:
    post:
      summary: Generate reports from uploaded ZIP packages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - zips
              properties:
                zips:
                  type: array
                  description: One or more collector ZIP packages.
                  items:
                    type: string
                    format: binary
                awrs:
                  type: array
                  description: |
                    Optional Oracle AWR HTML files.
                    Either provide `awrs` with the same count as `zips` (paired by index),
                    or provide per-item fields `awr_<index>` (1-based, e.g. `awr_1`).
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Task created and processing started (queued on a single worker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Upload too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reports/status/{task_id}:
    get:
      summary: Get task status
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.

  /api/reports/download/{task_id}:
    get:
      summary: Download result ZIP
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP file containing only successful items as `<zip-name>/report.docx`.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.
        "409":
          description: Task not finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reports/ws/{task_id}:
    get:
      summary: WebSocket stream for task logs and progress
      description: |
        WebSocket endpoint. Clients MUST pass the API token via `Sec-WebSocket-Protocol`.

        Example (browser):
        - `new WebSocket(wsUrl, [token])`

        The server negotiates the subprotocol by echoing the token value.

        Messages are JSON objects matching one of:
        - `WsLogMessage`
        - `WsProgressMessage`
        - `WsDoneMessage`
        - `WsErrorMessage`
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade).
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: The shared DBCHECK_API_TOKEN (report routes only, until they move to sessions).
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: session token
      description: The token from sign-in. WebSockets pass it as the subprotocol.
    publishAuth:
      type: http
      scheme: bearer
      bearerFormat: DBCHECK_PUBLISH_TOKEN
      description: The CI machine credential, compared in constant time. Publish API only.

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, invalid, failed]
        message:
          type: string
          description: Chinese, user-facing; the console shows it as-is.

    User:
      type: object
      required: [id, username, displayName, role, status]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: "`user` is the engineer role."
        status:
          type: string
          enum: [pending, active, rejected, disabled]
        mustChangePassword:
          type: boolean
          description: Present and true while a temporary password must be changed.

    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Opaque; only its hash is stored on the server.
        user:
          $ref: "#/components/schemas/User"

    Platform:
      type: string
      enum: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]

    ReleasePackage:
      type: object
      required: [platform, os, arch, fileName, size, sha256]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        os:
          type: string
          example: Linux
        arch:
          type: string
          example: ARM64
        fileName:
          type: string
          example: db-collector-1.2.0-linux-arm64.zip
        size:
          type: integer
          format: int64
          description: Bytes.
        sha256:
          type: string
          description: Lowercase hex.

    CollectorRelease:
      type: object
      required: [version, tag, commit, publishedAt, status, notes, dbTypes, packages]
      properties:
        version:
          type: string
          example: 1.2.0
        tag:
          type: string
          example: v1.2.0
        commit:
          type: string
        publishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pre-release, latest, deprecated, revoked]
        revokeReason:
          type: string
          description: Present exactly when `status` is `revoked`.
        notes:
          type: string
        dbTypes:
          type: array
          items:
            type: string
            enum: [mysql, oracle, gaussdb]
        packages:
          type: array
          description: In platform order.
          items:
            $ref: "#/components/schemas/ReleasePackage"

    PublishMetadata:
      type: object
      required: [version, tag, commit, publishedAt, dbTypes, packages]
      properties:
        version:
          type: string
          description: "`X.Y.Z` or `X.Y.Z-rcN`."
        tag:
          type: string
          description: Must be `v<version>`.
        commit:
          type: string
        publishedAt:
          type: string
          format: date-time
          description: RFC 3339.
        notes:
          type: string
          description: "`- ` bullet lines from the tag annotation."
        dbTypes:
          type: array
          items:
            type: string
            enum: [mysql, oracle, gaussdb]
        packages:
          type: array
          description: Exactly one per platform, all four.
          items:
            type: object
            required: [platform, size, sha256]
            properties:
              platform:
                $ref: "#/components/schemas/Platform"
              size:
                type: integer
                format: int64
              sha256:
                type: string

    GenerateResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - ws_url
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["processing"]
        total:
          type: integer
          minimum: 1
        ws_url:
          type: string
          description: Relative WS path, e.g. `/api/reports/ws/<task_id>`.

    StatusResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - completed
        - current_file
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["queued", "processing", "done", "failed"]
        total:
          type: integer
        completed:
          type: integer
        current_file:
          type: string
        download_url:
          type: string
          description: Present when status is `done`.
        error:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    WsLogMessage:
      type: object
      required: [type, seq, timestamp, level, message]
      properties:
        type:
          type: string
          enum: ["log"]
        seq:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: ["info", "success", "warn", "error"]
        message:
          type: string

    WsProgressMessage:
      type: object
      required: [type, seq, completed, total, current_file]
      properties:
        type:
          type: string
          enum: ["progress"]
        seq:
          type: integer
          format: int64
        completed:
          type: integer
        total:
          type: integer
        current_file:
          type: string

    WsDoneMessage:
      type: object
      required: [type, seq, download_url]
      properties:
        type:
          type: string
          enum: ["done"]
        seq:
          type: integer
          format: int64
        download_url:
          type: string

    WsErrorMessage:
      type: object
      required: [type, seq, message]
      properties:
        type:
          type: string
          enum: ["error"]
        seq:
          type: integer
          format: int64
        message:
          type: string

    WsMessage:
      oneOf:
        - $ref: "#/components/schemas/WsLogMessage"
        - $ref: "#/components/schemas/WsProgressMessage"
        - $ref: "#/components/schemas/WsDoneMessage"
        - $ref: "#/components/schemas/WsErrorMessage"
