openapi: 3.0.3
info:
  title: db-check Web Report API
  version: 0.1.0
  description: |
    Web service for generating db-check reports from uploaded collector ZIP packages.

    Platform routes (`/api/auth`, `/api/users`, and later `/api/releases`,
    `/api/downloads`) authenticate with a session token from sign-in
    (`Authorization: Bearer <token>`) and answer errors with `ApiError`
    (`{"code", "message"}`): 401 `unauthorized`, 403 `forbidden`,
    404 `not_found`, 400 or 409 `invalid`, anything else `failed`. The
    message is Chinese and shown to the user as-is.

    Access levels: most operations need an active user with no forced
    password change due (otherwise 403); current user accepts any account
    status except disabled. A disabled user's session answers 401.

    The `/api/reports` routes still check the shared `DBCHECK_API_TOKEN` and
    answer `ErrorResponse` until they move to sessions.

servers:
  - url: /

paths:
  /api/auth/sign-in:
    post:
      summary: Sign in with username and password
      description: |
        Opens a session that expires 7 days after it was issued. Failed
        sign-ins are logged; there is no lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in. Pending and rejected users sign in too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed body (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown user or wrong password (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Correct password, but the account is disabled (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/sign-out:
    post:
      summary: End the presented session
      description: Ending an unknown or expired session also succeeds.
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session ended.
        "401":
          description: No bearer token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/me:
    get:
      summary: The signed-in user
      description: Answers any account status except disabled.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The user behind the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/register:
    post:
      summary: Register as a pending engineer
      description: |
        Creates a pending engineer and signs them in, so they land on the
        waiting page. Nobody can register as admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Registered and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: |
            A blank field, a taken username, or a taken email (compared
            regardless of case) (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/resubmit:
    post:
      summary: Resubmit a rejected application
      description: |
        Rejected → pending, with the same username and email. Answers any
        account status except disabled; only a rejected user succeeds.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resubmission"
      responses:
        "200":
          description: Back to pending; the rejection reason is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Blank display name or team, or the user is not rejected (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/me:
    get:
      summary: The signed-in user's own profile
      description: Answers any account status except disabled, e.g. for the waiting page and the rejection reason.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users:
    get:
      summary: Every account (admin only)
      description: Newest application first, each with its account action history.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: All profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/{id}/{action}:
    post:
      summary: An admin's account action (admin only)
      description: |
        Role and account status are read from the store on every request, so
        the change applies to the user's next request. Every action appends
        to the user's account action history with the acting admin and time.

        - `approve`: pending → active.
        - `reject`: pending → rejected; `reason` required.
        - `disable`: active → disabled; `reason` required. Ends every session of the user.
        - `enable`: disabled → active; clears the reason.
        - `promote`: an active engineer becomes admin.
        - `demote`: an active admin becomes engineer.

        An admin can neither disable nor demote themselves, and neither
        action may leave the platform without an active admin.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [approve, reject, disable, enable, promote, demote]
      requestBody:
        description: Only `reject` and `disable` take a body.
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Trimmed; shown to the user.
      responses:
        "200":
          description: The account after the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: |
            A blank reason, the account is not in the status the action
            starts from, or an admin guard refuses (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/generate:
    post:
      summary: Generate reports from uploaded ZIP packages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - zips
              properties:
                zips:
                  type: array
                  description: One or more collector ZIP packages.
                  items:
                    type: string
                    format: binary
                awrs:
                  type: array
                  description: |
                    Optional Oracle AWR HTML files.
                    Either provide `awrs` with the same count as `zips` (paired by index),
                    or provide per-item fields `awr_<index>` (1-based, e.g. `awr_1`).
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Task created and processing started (queued on a single worker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Upload too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reports/status/{task_id}:
    get:
      summary: Get task status
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.

  /api/reports/download/{task_id}:
    get:
      summary: Download result ZIP
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP file containing only successful items as `<zip-name>/report.docx`.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.
        "409":
          description: Task not finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reports/ws/{task_id}:
    get:
      summary: WebSocket stream for task logs and progress
      description: |
        WebSocket endpoint. Clients MUST pass the API token via `Sec-WebSocket-Protocol`.

        Example (browser):
        - `new WebSocket(wsUrl, [token])`

        The server negotiates the subprotocol by echoing the token value.

        Messages are JSON objects matching one of:
        - `WsLogMessage`
        - `WsProgressMessage`
        - `WsDoneMessage`
        - `WsErrorMessage`
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade).
        "401":
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: The shared DBCHECK_API_TOKEN (report routes only, until they move to sessions).
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: session token
      description: The token from sign-in. WebSockets pass it as the subprotocol.

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, invalid, failed]
        message:
          type: string
          description: Chinese, user-facing; the console shows it as-is.

    User:
      type: object
      required: [id, username, displayName, role, status]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: "`user` is the engineer role."
        status:
          type: string
          enum: [pending, active, rejected, disabled]
        mustChangePassword:
          type: boolean
          description: Present and true while a temporary password must be changed.

    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Opaque; only its hash is stored on the server.
        user:
          $ref: "#/components/schemas/User"

    Registration:
      type: object
      required: [username, password, displayName, email, team, note]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
        email:
          type: string
        team:
          type: string
        note:
          type: string
          description: Application note (申请说明); may be empty.

    Resubmission:
      type: object
      required: [displayName, team, note]
      properties:
        displayName:
          type: string
        team:
          type: string
        note:
          type: string

    AccountAction:
      type: object
      required: [action, by, at]
      properties:
        action:
          type: string
          enum: [approve, reject, disable, enable, promote, demote, reset]
        by:
          type: string
          description: The acting admin's username.
        at:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [email, team, note, appliedAt, actions]
          properties:
            email:
              type: string
              description: Empty for an admin created by `db-web admin create`.
            team:
              type: string
            note:
              type: string
            appliedAt:
              type: string
              format: date-time
              description: The latest application (registration or resubmission).
            reason:
              type: string
              description: The admin's reason; present only while rejected or disabled.
            actions:
              type: array
              description: Every admin action on the account, oldest first; append-only.
              items:
                $ref: "#/components/schemas/AccountAction"

    GenerateResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - ws_url
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["processing"]
        total:
          type: integer
          minimum: 1
        ws_url:
          type: string
          description: Relative WS path, e.g. `/api/reports/ws/<task_id>`.

    StatusResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - completed
        - current_file
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["queued", "processing", "done", "failed"]
        total:
          type: integer
        completed:
          type: integer
        current_file:
          type: string
        download_url:
          type: string
          description: Present when status is `done`.
        error:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    WsLogMessage:
      type: object
      required: [type, seq, timestamp, level, message]
      properties:
        type:
          type: string
          enum: ["log"]
        seq:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: ["info", "success", "warn", "error"]
        message:
          type: string

    WsProgressMessage:
      type: object
      required: [type, seq, completed, total, current_file]
      properties:
        type:
          type: string
          enum: ["progress"]
        seq:
          type: integer
          format: int64
        completed:
          type: integer
        total:
          type: integer
        current_file:
          type: string

    WsDoneMessage:
      type: object
      required: [type, seq, download_url]
      properties:
        type:
          type: string
          enum: ["done"]
        seq:
          type: integer
          format: int64
        download_url:
          type: string

    WsErrorMessage:
      type: object
      required: [type, seq, message]
      properties:
        type:
          type: string
          enum: ["error"]
        seq:
          type: integer
          format: int64
        message:
          type: string

    WsMessage:
      oneOf:
        - $ref: "#/components/schemas/WsLogMessage"
        - $ref: "#/components/schemas/WsProgressMessage"
        - $ref: "#/components/schemas/WsDoneMessage"
        - $ref: "#/components/schemas/WsErrorMessage"
