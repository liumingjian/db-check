openapi: 3.0.3
info:
  title: db-check Web API
  version: 0.2.0
  description: |
    The db-web platform behind the inspection console: accounts and sessions,
    collector releases and their downloads, and report tasks generated from
    uploaded collector ZIP packages.

    The paths below are exactly the routes db-web registers;
    `TestOpenAPIDocumentMatchesTheRegisteredRoutes`
    (reporter/internal/web/openapi_test.go) fails when the two drift. Any
    other path answers 404 `not_found` (接口不存在). A registered path called
    with another method answers 405 with a plain-text body. A request whose
    `Origin` is outside `ALLOWED_ORIGINS` answers 403 `forbidden`
    (来源不在允许列表中) before routing.

    Platform routes (`/api/auth`, `/api/users`, `/api/releases`,
    `/api/downloads`, and `/api/reports`) authenticate with a session token
    from sign-in (`Authorization: Bearer <token>`; WebSockets pass it as the
    subprotocol) and answer errors with `ApiError`
    (`{"code", "message"}`): 401 `unauthorized`, 403 `forbidden`,
    404 `not_found`, 400 or 409 `invalid`, anything else `failed`. The
    message is Chinese and shown to the user as-is.

    Access levels: most operations need an active user with no forced
    password change due (otherwise 403); current user, own profile,
    resubmit, and the forced password change accept any account status
    except disabled. A disabled user's session answers 401. The shared
    `DBCHECK_API_TOKEN` is retired and accepted nowhere.

    The publish API (`/api/ci/releases`) takes no session: it authenticates
    the CI machine credential `DBCHECK_PUBLISH_TOKEN` (ADR 0002).

    A report task belongs to its submitter: anyone else but an admin gets
    404 `not_found` from reading it, its status, WebSocket, and download.

servers:
  - url: /

paths:
  /api/auth/sign-in:
    post:
      summary: Sign in with username and password
      description: |
        Opens a session that expires 7 days after it was issued. Failed
        sign-ins are logged; there is no lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in. Pending and rejected users sign in too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed body (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unknown user or wrong password (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Correct password, but the account is disabled (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/sign-out:
    post:
      summary: End the presented session
      description: Ending an unknown or expired session also succeeds.
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Session ended.
        "401":
          description: No bearer token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/me:
    get:
      summary: The signed-in user
      description: Answers any account status except disabled.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The user behind the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/register:
    post:
      summary: Register as a pending engineer
      description: |
        Creates a pending engineer and signs them in, so they land on the
        waiting page. Nobody can register as admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Registered and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: |
            A blank field, a taken username, or a taken email (compared
            regardless of case) (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/resubmit:
    post:
      summary: Resubmit a rejected application
      description: |
        Rejected → pending, with the same username and email. Answers any
        account status except disabled; only a rejected user succeeds.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resubmission"
      responses:
        "200":
          description: Back to pending; the rejection reason is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Blank display name or team, or the user is not rejected (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/me:
    get:
      summary: The signed-in user's own profile
      description: Answers any account status except disabled, e.g. for the waiting page and the rejection reason.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users:
    get:
      summary: Every account (admin only)
      description: Newest application first, each with its account action history.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: All profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/{id}/{action}:
    post:
      summary: An admin's account action (admin only)
      description: |
        Role and account status are read from the store on every request, so
        the change applies to the user's next request. Every action appends
        to the user's account action history with the acting admin and time.

        - `approve`: pending → active.
        - `reject`: pending → rejected; `reason` required.
        - `disable`: active → disabled; `reason` required. Ends every session of the user.
        - `enable`: disabled → active; clears the reason.
        - `promote`: an active engineer becomes admin.
        - `demote`: an active admin becomes engineer.

        An admin can neither disable nor demote themselves, and neither
        action may leave the platform without an active admin.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [approve, reject, disable, enable, promote, demote]
      requestBody:
        description: Only `reject` and `disable` take a body.
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Trimmed; shown to the user.
      responses:
        "200":
          description: The account after the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: |
            A blank reason, the account is not in the status the action
            starts from, or an admin guard refuses (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/{id}/reset-password:
    post:
      summary: Reset a user's password (admin only)
      description: |
        Sets a generated temporary password that the user must change at the
        next sign-in (`mustChangePassword`), ends every session of the user,
        and appends `reset` to their account action history. The temporary
        password appears in this response only, for the admin to hand over
        in person.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The account after the reset, and the temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/users/me/password:
    post:
      summary: Change the signed-in user's own password
      description: |
        A forced change (`mustChangePassword`, after a reset or `db-web admin
        create`) needs no current password and lifts the forced-change gate.
        Otherwise only an active user may change their password, and only
        with the right current password. The session stays signed in.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                currentPassword:
                  type: string
                  description: Required unless the change is forced.
      responses:
        "200":
          description: The caller's profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: |
            (`invalid`) A missing current password (请输入当前密码), a wrong
            one (当前密码不正确), a blank new password (请输入新密码), or a
            new password equal to the current one (新密码不能与当前密码相同).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session, or the user is disabled (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A voluntary change by a user who is not active (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/releases:
    get:
      summary: The collector releases the user may see, newest first
      description: |
        Engineers get latest and deprecated releases; admins get every
        status. Needs an active user.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Releases, newest publish time first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorRelease"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or a password change is due (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/releases/{version}/{action}:
    post:
      summary: Change a release's status (admins only)
      description: |
        Applies one row of the release status table
        (docs/specs/collector-and-user-management.md):

        | action | from | to |
        |---|---|---|
        | promote | pre-release, deprecated | latest; the previous latest becomes deprecated |
        | deprecate | latest, deprecated, pre-release | deprecated |
        | revoke | pre-release, latest, deprecated | revoked; `reason` required |
        | restore | revoked | deprecated; the revocation reason is dropped |

        Deprecating or revoking the latest release leaves no latest release.
      security:
        - sessionAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: 1.3.0-rc1
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [promote, deprecate, revoke, restore]
      requestBody:
        description: Only for `revoke`; other actions send no body.
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Trimmed; blank is refused.
      responses:
        "204":
          description: Status changed.
        "400":
          description: The table does not allow the action from the current status, or a revoke has no reason (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown version or action (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/releases/{version}/packages/{platform}:
    get:
      summary: Download one release package
      description: |
        Streams the package as a `.zip` attachment and writes one download
        record (user, release, package, time) as the transfer starts.
        Engineers may download latest and deprecated releases; admins may
        download every status. A package the user may not see answers
        404 `not_found`, exactly like an unknown one, and writes no record.
        Needs an active user.
      security:
        - sessionAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: 1.2.0
        - name: platform
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Platform"
      responses:
        "200":
          description: The package file.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="db-collector-1.2.0-linux-amd64.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or a password change is due (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: |
            Unknown version or platform, or a release the user may not see:
            pre-release and revoked releases for engineers (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/downloads:
    get:
      summary: Download records, newest first (admins only)
      description: |
        Every query parameter is optional and narrows the list; set ones
        must all match. Not paginated.
      security:
        - sessionAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          example: u-user-001
        - name: version
          in: query
          description: Release version.
          schema:
            type: string
          example: 1.2.0
        - name: from
          in: query
          description: Keeps records at or after this time (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Keeps records strictly before this time (exclusive).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Matching download records, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadRecord"
        "400":
          description: "`from` or `to` is not an RFC 3339 time (`invalid`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/ci/releases:
    post:
      summary: Publish a collector release with its four packages (CI only)
      description: |
        The publish script's API (ADR 0002); `scripts/publish_release.sh`
        is its only client, run by a person until the CI phase and by CI
        after. Package files are named `db-collector-<version>-<platform>.zip`.
        One multipart request carries
        the metadata and exactly four `.zip` package files. The server checks
        each file's size and SHA256 against the metadata, stores the files
        under `<data dir>/releases/<version>/`, and inserts the release in
        one transaction, so a refused or interrupted publish leaves nothing
        visible.

        A `vX.Y.Z` tag publishes as latest and the previous latest becomes
        deprecated; a `vX.Y.Z-rcN` tag publishes as a pre-release.

        Re-publishing a version with the same tag, commit, and package files
        answers 200 and changes nothing; any other difference answers 409.
        User sessions are never accepted.
      security:
        - publishAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, linux-amd64, linux-arm64, windows-amd64, windows-arm64]
              properties:
                metadata:
                  $ref: "#/components/schemas/PublishMetadata"
                linux-amd64:
                  type: string
                  format: binary
                  description: The package file; its file name must end in `.zip` and it must be a zip.
                linux-arm64:
                  type: string
                  format: binary
                windows-amd64:
                  type: string
                  format: binary
                windows-arm64:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        "200":
          description: Identical re-publish; the stored release, unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRelease"
        "201":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRelease"
        "400":
          description: |
            `invalid`: malformed request or metadata; a version that is not
            `X.Y.Z` or `X.Y.Z-rcN`; a tag other than `v<version>`; an unknown
            database type; a missing, repeated, or unknown platform; a
            package that is not a `.zip`; a size or SHA256 mismatch; a body
            over `--max-upload-bytes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or wrong publish credential (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Publishing is disabled because `DBCHECK_PUBLISH_TOKEN` is not set (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The version is already published with different content (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/generate:
    post:
      summary: Submit a report task
      description: |
        Needs an active user, who becomes the task's submitter. The server
        reads each ZIP's `db_type` and `collector_version` itself (the one
        `manifest.json`, then `manifest.artifacts.result`, then that file's
        `meta` block) and stores the task and its report items before it
        answers, so an acknowledged task is never lost. A worker takes
        stored tasks in submission order; tasks interrupted by a restart
        resume.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - zips
              properties:
                zips:
                  type: array
                  description: One or more collector ZIP packages, one per report item.
                  items:
                    type: string
                    format: binary
                awrs:
                  type: array
                  description: |
                    Optional Oracle AWR HTML files.
                    Either provide `awrs` with the same count as `zips` (paired by index),
                    or provide per-item fields `awr_<index>` (1-based, e.g. `awr_1`; at most one per item).
                  items:
                    type: string
                    format: binary
                wdrs:
                  type: array
                  description: |
                    Optional GaussDB WDR HTML files, paired like `awrs`, or per-item
                    fields `wdr_<index>` (any number per item).
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Task stored; it reports `processing` until it finishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          description: |
            No ZIP, a ZIP the server cannot read (the message names the file
            and the problem), or misplaced AWR/WDR files (`invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Upload too large (`failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports:
    get:
      summary: All report tasks, newest first (管理 → 全部报告; admins only)
      description: |
        Every user's tasks, disabled users' included. Not paginated.
      security:
        - sessionAuth: []
      parameters:
        - name: submitterId
          in: query
          description: Keeps only this submitter's tasks; an unknown id answers an empty list.
          schema:
            type: string
          example: u-user-001
      responses:
        "200":
          description: Matching report tasks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportTask"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not an active admin (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/mine:
    get:
      summary: The caller's own report tasks, newest first (我的报告)
      description: Admins get only their own tasks here too. Not paginated.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The caller's report tasks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportTask"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/tasks/{id}:
    get:
      summary: One report task
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTask"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such task, or another user's task for an engineer (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/status/{id}:
    get:
      summary: Get task status
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such task, or another user's task for an engineer (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/download/{id}:
    get:
      summary: Download result ZIP
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ZIP file containing only successful items as `<zip-name>/report.docx`.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such task, or another user's task for an engineer (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The task is not done, or it expired (已过期): 30 days after
            submission its files are deleted and only the record stays
            (`invalid`, message `报告已超过 30 天保留期，文件已清理`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/reports/ws/{id}:
    get:
      summary: WebSocket stream for task logs and progress
      description: |
        WebSocket endpoint. Clients pass the session token as the subprotocol
        (`Sec-WebSocket-Protocol`); the server checks it like a bearer token
        and accepts by echoing it.

        Example (browser):
        - `new WebSocket(wsUrl, [token])`

        The stream replays the kept logs, then a progress snapshot, then
        live events. A finished task ends with `done` or `error`, after which
        the server closes the socket.

        Messages are JSON objects matching one of:
        - `WsLogMessage`
        - `WsProgressMessage`
        - `WsDoneMessage`
        - `WsErrorMessage`
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade).
        "401":
          description: No live session (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The account is not active, or must change its password first (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such task, or another user's task for an engineer (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: session token
      description: The token from sign-in. WebSockets pass it as the subprotocol.
    publishAuth:
      type: http
      scheme: bearer
      bearerFormat: DBCHECK_PUBLISH_TOKEN
      description: The CI machine credential, compared in constant time. Publish API only.

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, invalid, failed]
        message:
          type: string
          description: Chinese, user-facing; the console shows it as-is.

    User:
      type: object
      required: [id, username, displayName, role, status]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: "`user` is the engineer role."
        status:
          type: string
          enum: [pending, active, rejected, disabled]
        mustChangePassword:
          type: boolean
          description: Present and true while a temporary password must be changed.

    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Opaque; only its hash is stored on the server.
        user:
          $ref: "#/components/schemas/User"

    Registration:
      type: object
      required: [username, password, displayName, email, team, note]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
        email:
          type: string
        team:
          type: string
        note:
          type: string
          description: Application note (申请说明); may be empty.

    Resubmission:
      type: object
      required: [displayName, team, note]
      properties:
        displayName:
          type: string
        team:
          type: string
        note:
          type: string

    AccountAction:
      type: object
      required: [action, by, at]
      properties:
        action:
          type: string
          enum: [approve, reject, disable, enable, promote, demote, reset]
        by:
          type: string
          description: The acting admin's username.
        at:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [email, team, note, appliedAt, actions]
          properties:
            email:
              type: string
              description: Empty for an admin created by `db-web admin create`.
            team:
              type: string
            note:
              type: string
            appliedAt:
              type: string
              format: date-time
              description: The latest application (registration or resubmission).
            reason:
              type: string
              description: The admin's reason; present only while rejected or disabled.
            actions:
              type: array
              description: Every admin action on the account, oldest first; append-only.
              items:
                $ref: "#/components/schemas/AccountAction"

    PasswordReset:
      type: object
      required: [profile, temporaryPassword]
      properties:
        profile:
          $ref: "#/components/schemas/UserProfile"
        temporaryPassword:
          type: string
          description: Shown once; the user must change it at the next sign-in.

    Platform:
      type: string
      enum: [linux-amd64, linux-arm64, windows-amd64, windows-arm64]

    ReleasePackage:
      type: object
      required: [platform, os, arch, fileName, size, sha256]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        os:
          type: string
          example: Linux
        arch:
          type: string
          example: ARM64
        fileName:
          type: string
          example: db-collector-1.2.0-linux-arm64.zip
        size:
          type: integer
          format: int64
          description: Bytes.
        sha256:
          type: string
          description: Lowercase hex.

    CollectorRelease:
      type: object
      required: [version, tag, commit, publishedAt, status, notes, dbTypes, packages]
      properties:
        version:
          type: string
          example: 1.2.0
        tag:
          type: string
          example: v1.2.0
        commit:
          type: string
        publishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pre-release, latest, deprecated, revoked]
        revokeReason:
          type: string
          description: Present exactly when `status` is `revoked`.
        notes:
          type: string
        dbTypes:
          type: array
          items:
            type: string
            enum: [mysql, oracle, gaussdb]
        packages:
          type: array
          description: In platform order.
          items:
            $ref: "#/components/schemas/ReleasePackage"

    DownloadRecord:
      type: object
      description: Which user downloaded which release package, and when.
      required: [id, userId, version, platform, at]
      properties:
        id:
          type: string
        userId:
          type: string
        version:
          type: string
          example: 1.2.0
        platform:
          $ref: "#/components/schemas/Platform"
        at:
          type: string
          format: date-time

    PublishMetadata:
      type: object
      required: [version, tag, commit, publishedAt, dbTypes, packages]
      properties:
        version:
          type: string
          description: "`X.Y.Z` or `X.Y.Z-rcN`."
        tag:
          type: string
          description: Must be `v<version>`.
        commit:
          type: string
        publishedAt:
          type: string
          format: date-time
          description: RFC 3339.
        notes:
          type: string
          description: "`- ` bullet lines from the tag annotation."
        dbTypes:
          type: array
          items:
            type: string
            enum: [mysql, oracle, gaussdb]
        packages:
          type: array
          description: Exactly one per platform, all four.
          items:
            type: object
            required: [platform, size, sha256]
            properties:
              platform:
                $ref: "#/components/schemas/Platform"
              size:
                type: integer
                format: int64
              sha256:
                type: string

    ReportTask:
      type: object
      description: A recorded report task (CONTEXT.md, Report task).
      required: [id, submitter, status, createdAt, expired, items]
      properties:
        id:
          type: string
        submitter:
          type: object
          required: [id, displayName]
          properties:
            id:
              type: string
            displayName:
              type: string
        status:
          type: string
          enum: [processing, done, failed]
          description: A task still queued on the server reports `processing`. A task with some failed items is `done`.
        createdAt:
          type: string
          format: date-time
        expired:
          type: boolean
          description: >-
            True from 30 days after submission (已过期). From then on the task
            cannot be downloaded, and the server deletes its uploaded inputs,
            extracted data, and generated reports within the hour. The record stays.
        items:
          type: array
          description: In submission order.
          items:
            $ref: "#/components/schemas/ReportItem"

    ReportItem:
      type: object
      required: [fileName, dbType, collectorVersion, collectorNotice, outcome]
      properties:
        fileName:
          type: string
        dbType:
          type: string
          enum: [mysql, oracle, gaussdb]
          description: What the server read from the ZIP.
        collectorVersion:
          type: string
          nullable: true
          description: "`meta.collector_version` the server read from the ZIP; null when unknown."
        collectorNotice:
          nullable: true
          description: |
            What the item's collector release currently calls for: `{"status": "deprecated"}`,
            or `{"status": "revoked", "reason"}`; null for a latest or pre-release version, an
            unpublished version, or no version. Joined with the release's current status on every
            read, so changing a release's status changes the notice on tasks already recorded.
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [deprecated, revoked]
            reason:
              type: string
              description: Present for `revoked`.
        outcome:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [processing, done, failed]
            reason:
              type: string
              description: Present exactly when `failed`.

    GenerateResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - ws_url
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["processing"]
        total:
          type: integer
          minimum: 1
        ws_url:
          type: string
          description: Relative WS path, e.g. `/api/reports/ws/<task_id>`.

    StatusResponse:
      type: object
      required:
        - task_id
        - status
        - total
        - completed
        - current_file
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: ["processing", "done", "failed"]
          description: A task still queued on the server reports `processing`.
        total:
          type: integer
          description: The number of report items.
        completed:
          type: integer
          description: Report items finished, done or failed.
        current_file:
          type: string
          description: The ZIP being generated; empty between items.
        download_url:
          type: string
          description: Present when status is `done`.
        error:
          type: string
          description: Why a failed task failed.

    WsLogMessage:
      type: object
      required: [type, seq, timestamp, level, message]
      properties:
        type:
          type: string
          enum: ["log"]
        seq:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: ["info", "success", "warn", "error"]
        message:
          type: string

    WsProgressMessage:
      type: object
      required: [type, seq, completed, total, current_file]
      properties:
        type:
          type: string
          enum: ["progress"]
        seq:
          type: integer
          format: int64
        completed:
          type: integer
        total:
          type: integer
        current_file:
          type: string

    WsDoneMessage:
      type: object
      required: [type, seq, download_url]
      properties:
        type:
          type: string
          enum: ["done"]
        seq:
          type: integer
          format: int64
        download_url:
          type: string

    WsErrorMessage:
      type: object
      required: [type, seq, message]
      properties:
        type:
          type: string
          enum: ["error"]
        seq:
          type: integer
          format: int64
        message:
          type: string

    WsMessage:
      oneOf:
        - $ref: "#/components/schemas/WsLogMessage"
        - $ref: "#/components/schemas/WsProgressMessage"
        - $ref: "#/components/schemas/WsDoneMessage"
        - $ref: "#/components/schemas/WsErrorMessage"
